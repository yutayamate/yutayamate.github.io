<meta http-equiv="X-UA-Compatible" content="ie=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ site.tagline }}">
<meta name="theme-color" content="#0a0d12">
<meta property="og:title" content="{{ site.name }} — {{ site.role }}">
<meta property="og:description" content="{{ site.summary }}">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.yutayamate.com/">
<meta property="og:image" content="{{ site.Image_URL }}">
<title>{{ site.name }} — {{ site.role }}</title>
<link rel="shortcut icon"
    href="https://images.weserv.nl/?url={{ site.Image_URL }}&h=300&w=300&fit=cover&mask=circle&output=webp&q=75"
    onerror="this.onerror=null;this.href='{{ site.Image_URL }}';" type="image/x-icon">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

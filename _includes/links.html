<div class="featured-links">
    {% for link in site.links %}
    {% if link.URL and link.Featured %}
    <a class="profile-link profile-link-featured"
        href="{{ link.URL }}{% if link.Username %}/{{ link.Username }}{% endif %}"
        target="_blank" rel="noopener noreferrer">
        <span class="profile-icon" style="--link-color: {{ link.Color | default: '#89dceb' }};">
            <i class="{{ link.Icon-Class }}" aria-hidden="true"></i>
        </span>
        <span>
            <strong>{{ link.Name }}</strong>
            <small>Open profile</small>
        </span>
        <span class="profile-arrow" aria-hidden="true">↗</span>
    </a>
    {% endif %}
    {% endfor %}
</div>

<div class="all-links" aria-label="More profiles">
    {% for link in site.links %}
    {% if link.URL and link.Featured != true %}
    <a class="profile-link"
        href="{{ link.URL }}{% if link.Username %}/{{ link.Username }}{% endif %}"
        target="_blank" rel="noopener noreferrer">
        <span class="profile-icon" style="--link-color: {{ link.Color | default: '#89dceb' }};">
            <i class="{{ link.Icon-Class }}" aria-hidden="true"></i>
        </span>
        <strong>{{ link.Name }}</strong>
        <span class="profile-arrow" aria-hidden="true">↗</span>
    </a>
    {% endif %}
    {% endfor %}
</div>
